services:
  docmost:
    image: docmost/docmost:latest
    depends_on:
      - db
      - redis
    env_file: ${ENV_FILE:-.env}
    ports:
      - ${DOCMOST_PORT:-3000}:3000
    restart: unless-stopped
    volumes:
      - ${APP_DIR:-.}/docmost:/app/data/storage

  db:
    image: postgres:18
    env_file: ${ENV_FILE:-.env}
    restart: unless-stopped
    volumes:
      - ${APP_DIR:-.}/db:/var/lib/postgresql

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - ${APP_DIR:-.}/redis:/data
